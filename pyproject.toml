[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dev-runner"
version = "0.1.0"
description = "A minimal foreground Ralph runner with verified development-branch publication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentic-runner = "agentic_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
