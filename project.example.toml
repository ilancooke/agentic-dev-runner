# Copy to a runner-owned config outside the managed project. Paths are relative
# to this file. Run setup --config <this-file>, then run --config <this-file>.
[project]
name = "YOUR_ACCOUNT/YOUR_PROJECT"
repository = "/absolute/path/to/project"
development_branch = "development"
verification = [["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]]
